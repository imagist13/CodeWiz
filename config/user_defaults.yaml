# Default settings for all Hermes users.
# YAML and JSON formats are both supported.
# Sensitive fields (api_key) are encrypted at rest in per-user config.json.

provider: minimax
model: gpt-4o

minimax_model: MiniMax-Text-01
minimax_base_url: https://api.minimax.chat/v1

deepseek_model: deepseek-chat
deepseek_base_url: https://api.deepseek.com

anthropic_model: claude-sonnet-4-20250514

timeout: 60
temperature: 0.7
streaming: true
max_history: 100
tool_timeout: 30
auto_improve_time: 0
forget_time: 0
font_size: 14
theme: dark
soul: ""
max_tool_rounds: 10
api_key: ""
