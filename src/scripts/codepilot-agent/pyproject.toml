[project]
name = "codepilot-agent"
version = "0.2.0"
description = "CodePilot Python Agent — multi-turn tool-use agent runtime via Anthropic API"
readme = "README.md"
license = {text = "BUSL-1.1"}
authors = [
    {name = "op7418", email = "guohao631@gmail.com"}
]
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.18.0",
    "openai>=1.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
codepilot-agent = "codepilot_agent.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
